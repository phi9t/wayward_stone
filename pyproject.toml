[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wayward-stone"
version = "0.1.0"
description = "Fan-continuation of the Kingkiller Chronicle — Day Three toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.0",
]
audiobook = [
    "numpy",
    "soundfile",
]

[project.scripts]
inkforge-loop = "inkforge_loop.cli:main"

[tool.setuptools.packages.find]
include = ["inkforge_loop*", "audiobook*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "qwen_tts.*",
    "soundfile",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not runtime\""
markers = [
    "unit: Fast unit tests for pure logic and local functions.",
    "integration_offline: Integration tests without Docker/GPU/model downloads.",
    "runtime: Full runtime integration tests requiring Docker/NVIDIA/Zephyr.",
]
